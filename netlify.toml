# TanStack Start is built via Nitro's `netlify` preset (see vite.config.ts).
# Nitro emits the SSR handler to `.netlify/functions-internal/server` and
# writes static client assets + `_redirects` to the publish dir it manages,
# so `command` and `publish` are all Netlify needs here.
[build]
  command = "npm run build"
  publish = "dist"